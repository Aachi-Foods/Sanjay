# Builds the BNR Event Planners site (bnr-event-planners/) as a static
# export and publishes it to GitHub Pages.
#
# One-time setup required in the repo settings before this will deploy:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions, add:
#      - NEXT_PUBLIC_SUPABASE_URL
#      - NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# Note: GitHub Pages serves one live site per repository. If another
# workflow in this repo also deploys to the "github-pages" environment,
# whichever runs most recently is what's actually live.
name: Deploy BNR Event Planners to GitHub Pages

on:
  push:
    branches: ["claude/bnr-event-planners-site-vdb0dv"]
    paths: ["bnr-event-planners/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bnr-event-planners
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bnr-event-planners/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bnr-event-planners/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
